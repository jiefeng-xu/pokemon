<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Movement Game</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd84f'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div>
          <h1>Pokemon Game</h1>
          <p>Use the arrow keys to move.</p>
        </div>
        <button id="musicButton" class="music-button" type="button">
          Start Music
        </button>
      </header>

      <section id="gameField" class="game-field" aria-label="Pokemon movement field">
        <div id="blockLayer" class="block-layer" aria-hidden="true"></div>
        <div id="snake" class="snake" aria-label="Snake enemy">
          <span class="snake-eye snake-eye-left"></span>
          <span class="snake-eye snake-eye-right"></span>
          <span class="snake-tongue"></span>
        </div>
        <div id="pokemon" class="pokemon" aria-label="Pokemon player">
          <span class="ear ear-left"></span>
          <span class="ear ear-right"></span>
          <span class="face">
            <span class="eye eye-left"></span>
            <span class="eye eye-right"></span>
            <span class="cheek cheek-left"></span>
            <span class="cheek cheek-right"></span>
            <span class="mouth"></span>
          </span>
        </div>
      </section>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
